<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.js"
      integrity="sha512-jKxp7JHEN6peEmzmg6a7XJBORNTB0ITD2Pi+6FUkc16PCaNAJX2ahZ1ejn1p1uY37Pxyirn/0OMNZbITbEg3jw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    제이쿼리 배열 관련 메서드


    제이쿼리로 태그를 선택하게 되면 여러 개의 태그일 경우 유사배열안에
    담기게 된다. 이때 배열 관련 메서드를 사용하면 태그 요소들을 자유롭게
    조작할 수 있다.

    1. each() / $.each() 메서드

    선택자로 선택한 요소는 배열에 순서대로 저장된다. 이때 each() / $.each()메서드는
    배열에 저장된 요소를 순서대로 하나씩 선택하면서 인덱스 정보를 가져온다.

    [기본형]
    1. $("요소").each(function(매개변수1, 매개변수2){ 코드 })
    2. $.each($("요소"), (function(매개변수1, 매개변수2){ 코드 })
    배열에 저장된 요소만큼 메서드를 반복실행한다. 메서드를 실행할때마다
    매개변수 1,2에는 배열에 저장된 요소와 인덱스값이 배열의 오름차순으로 대입된다.

    3. $("요소").each(function() { $(this) })
    4. $.each($("요소"), function() { $(this) })
    배열에 저장된 요소만큼 메서드를 반복실행한다. 메서드를 실행할때마다 $(this)안에는
    배열에 저장된 요소가 오름차순으로 대입된다.
    -->
    <h1>제이쿼리 배열 메서드</h1>
    <ul id="menu1">
      <li>내용1-1</li>
      <li>내용1-2</li>
      <li>내용1-3</li>
    </ul>
    <ul id="menu2">
      <li>내용2-1</li>
      <li>내용2-2</li>
      <li>내용2-3</li>
    </ul>
  </body>
  <script>
    $(function () {
      let obj = [
        {
          area: "서울",
        },
        {
          area: "부산",
        },
        {
          area: "전주",
        },
      ];

      //obj배열울 순회하면서 each메서드로 어떤 내용이 있는지 확인해보기
      $(obj).each(function (i, o) {
        console.log(i + "는?", o);
      });

      $.each($("#menu2 li"), function (i, ele) {
        console.log(i + "는?", ele);
      });
    });
  </script>
</html>
