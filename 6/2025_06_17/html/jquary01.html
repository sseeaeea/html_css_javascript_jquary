<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.js"
      integrity="sha512-jKxp7JHEN6peEmzmg6a7XJBORNTB0ITD2Pi+6FUkc16PCaNAJX2ahZ1ejn1p1uY37Pxyirn/0OMNZbITbEg3jw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    속성탐색선택자

    속성탐색선택자는 선택한 요소를 기준으로 일치하는 속성의 포함여부에 다라
    요소를 선택하는 선택자이다
    예를들어 선택한 이미지 태그 중 alt속성 값이 "건물"인 요소를 찾고 싶을때
    속성탐색선택자를 사용할 수 있다.

    속성과 값에 따른 탐색 선택자

    선택한 요소 중 지정한 속성과 일치하는 속성이 있는지, 없는지의
    포함여부를 따져서 요소를 선택한다.

    [기본형]
    - $("요소[속성]") : 선택한 요소 중 지정한 속성이 포함된 요소를 선택한다.
    - $("요소[속성=값]") : 선택한 요소 중 지정한 속성과 값이 모두 일치하는 요소를 선택한다.
    - $("요소[속성^=값]") : 선택한 요소 중 명시한 속성값으로 시작하는 요소를 선택한다.
    이때 값은 한 단어로 일치해야 한다.
    - $("요소[속성$=값]") : 선택한 요소 중 명시한 속성값으로 끝나는 요소를 선택한다.
    이때 값은 한 단어로 일치해야 한다.
    - $("요소[속성*=값]") : 선택한 요소 중 명시한 속성값을 포함하는 요소를 선택한다.
    이떄 값은 한 단어로 일치하지 않아도 되며, 위치도 구애받지 않는다.
    - $(":type속성값") : input태그중 type속성값이 일치하는 요소만 선택한다.
    -->

    <div id="wrap">
      <p>
        <a href="https://www.naver.com" target="_blank">네이버</a>
      </p>
      <p>
        <a href="https://www.daum.net">다음</a>
      </p>
      <p>
        <a href="https://www.google.com">구글</a>
      </p>
      <p>
        <a href="https://www.kakao.com">카카오</a>
      </p>
    </div>
    <form action="#" method="post" id="member">
      <p>
        <label for="user_id">아이디</label>
        <input type="text" name="user_id" id="user_id" />
      </p>
      <p>
        <label for="user_pw">비밀번호</label>
        <input type="password" name="user_pw" id="user_pw" />
      </p>
    </form>
  </body>
  <script>
    $(function () {
      // wrap안에 있는 a태그중 target속성이 있는
      $("#wrap a[target]").css({ color: "tomato" });
      $("label[for = user_id]").css({ color: "pink" });
      $("#wrap a[href ^=https]").css({ textDecoration: "none" });
      $("#wrap a[href $=https]").css({ backgroundColor: "blue" });
      //input요소중 type속성이 text인 요소 선택
      $(":text").css({
        backgroundColor: "orange",
        color: "blue",
        border: "1px solid orange",
      });

      //input요소중 type속성이 password인 요소 선택
      $(":password").css({
        backgroundColor: "orange",
        color: "blue",
        border: "1px solid orange",
      });
    });
  </script>
</html>
