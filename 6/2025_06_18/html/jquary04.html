<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>객체 조작 메서드</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    객체 조작 메서드

    객체를 생성, 복제, 삭제, 속성을 변환하는 메서드들이다.
    객체 조작 메서드에는 크게 '속성조작메서드' 와 '수치조작메서드' 와
    '객체편집메서드'로 나눠진다.

    '속성조작메서드'는 요소의 속성을 바꿀때 사용하고 '수치조작메서드'는
    요소의 넓이, 높이, 위치와 같은 수치를 조작할때 사용하고
    '객체편집메서드'는 말 그대로 객체를 생성하거나 삭제하거나 복제할때 사용한다.

    속성조작메서드

    1. html() / text()

    html()메서드는 선택한 요소의 하위 요소를 요소를 가져와 문자열로 반환하거나
    하위 요소를 전부 제거해서 새 요소로 바꿀때 사용한다.

    text() 선택한 요소에 포함되어 있는 전체 텍스트를 가져오거나 하위 요소를
    전부 제거하고 새 텍스트로 바꿀때 사용한다.

    [기본형]
    $("요소").html();
    선택한 요소의 모든 하위ㅜ요소를 가져와 문자열로 반환한다.

    $("요소").text();
    선택한 요소의 모든 텍스트만 가져온다.

    $("요소").html("새 요소");
    선택한 요소의 하위요소를 모두 지운 후 새 요소로 바꿈

    $("요소").text("새 텍스트")
    선택한 요소의 하위요소를 모두 지운 후 새 텍스트로 바꿈
    -->
    <h2>
      <strong>객체 조작 및 생성</strong>
    </h2>
    <section id="sec1">
      <h3>
        <em>html()</em>
      </h3>
      <p>내용1</p>
    </section>
    <section id="sec2">
      <h3>
        <em>text()</em>
      </h3>
      <p>내용2</p>
    </section>
  </body>
  <script>
    $(function () {
      // #sec1의 모든 하위요소를 문자열로 반환
      let result1 = $("#sec1").html();
      console.log(result1);
      // #sec1의 p태그의 하위요소(text)를 비우고 a태그를 넣는다.
      $("#sec1 p").html("<a href='#'>Text1</a>");

      // #sec2의 모든 텍스트를 반환
      let result2 = $("#sec2").text();
      console.log(result2);

      // #sec2의 h3태그안을 비우고 text()라는 문자로 변환
      $("#sec2 h3").text("text()");
    });
  </script>
</html>
