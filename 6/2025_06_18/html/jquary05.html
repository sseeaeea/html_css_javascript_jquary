<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    2. attr() / removeAttr()

    attr()메서드는 선택한 요소에 새로운 속성을 생성하거나 기존의 속성값을
    변경하고 싶을때 사용한다.
    removeAttr()메서드는 선택한 요소에서 기존 속성을 제거하고 싶을때
    사용한다

    [기본형]
    - $("요소").attr("속성명")
    선택한 요소에서 지정한 속성의 값을 가져옴

    - $("요소").attr("속성명", "값")
    선택한 요소에서 지정한 속성의 값을 바꿈

    - $("요소").attr("속성명1" : "값1", "속성명2" : "값2")
    선택한 요소에서 지정한 속성을 여러개 적용한다.

    - $("요소").removeAttr("지우고 싶은 속성명")
    -->
    <h2>attr(), removeAttr()메서드</h2>

    <div id="img_area">
      <img
        src="../image/28092fee-1da7-4d8f-854e-23cb38509e2c.jpg"
        alt="flower"
      />
    </div>
  </body>
  <script>
    $(function () {
      // #img_area안에 img태그의 src속성값을 가져온다.
      let srcVal = $("#img_area > img").attr("src");
      console.log(srcVal);

      $("#img_area > img")
        .attr({
          width: "300",
          src: "../image/87364.jpg",
        })
        .removeAttr("alt");
    });
  </script>
</html>
