<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주요 선택자 숙제</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <div class="wrap_1">
      <p>텍스트1</p>
      <p class="active">내용2</p>
      <p>
        <a href="#">네이버</a>
      </p>
      <p>
        <input type="text" value="dotkim" />
      </p>
    </div>
    <div class="wrap_2">
      <p>내용5</p>
      <p>내용6</p>
    </div>
    <div class="wrap_3">
      <div>
        <p>내용7</p>
        <p>내용8</p>
      </div>
    </div>
  </body>
  <script>
    $(function () {
      //1. .wrap_1안에 있는 p태그중에서 첫번째 요소를 선택하여 글자를 "내용1"로 바꾸기
      $(".wrap_1 p:eq(0)").text("내용1");
      //2. .wrap_1안에 있는 p태그중에서 class명이 active인 요소를 선택해서
      //클래스명 active를 삭제하고 on이라는 클래스명 추가하기
      $(".wrap_1 .active").removeClass("active").addClass("on");
      //3. .wrap_1안에 p태그중 인덱스번호 2번에 위치한 p태그안의 a태그를 선택해서
      //href속성을 https://www.naver.com으로 바꾸기
      $(".wrap_1 > p:eq(2) > a").attr({
        href: "https://www.naver.com",
      });
      //4. .wrap_1안에 p태그중 인덱스번호 3번에 위치한 p태그안의 input태그를 선택하여
      //value값을 'dotLee'로 바꾸기
      $(".wrap_1 > p:eq(3) > input").attr({
        value: "dotLee",
      });
      //5. .wrap_2안에 p태그중 첫번째 태그 뒤에 <p>추가1</p>을 추가하기
      $(".wrap_2 p:eq(0)").before("<p>추가1</p>");
      //6. .wrap_2안에 p태그중 첫번째 태그 앞에 <p>추가2</p>을 추가하기
      $(".wrap_2 p:eq(1)").after("<p>추가2</p>");
      //7. .wrap_3안에 p태그를 선택하여 부모태그를 삭제하고 p태그 안을 strong로 감싸기
      $(".wrap_3 > div > p").unwrap();
      $(".wrap_3 > p").wrapAll("<strong/>");
    });
  </script>
</html>
