<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    3. unwrap() / wrap() / wrapAll() / wrapInner() 메서드
    unwrap()메서드는 선택한 요소의 부모요소를 삭제한다.
    wrap()메서드는 선택한 요소를 새 요소로 감싼다.
    wrapAll()메서드는 선택한 요소를 새 요소로 한번에 감싼다.
    wrapInner()메서드는 선택한 요소의 하위 요소를 새 요소로 감싼다.

    [기본형]
    -$("요소").unwrap();
    -$("요소").wrap("새요소");
    -$("요소").wrapAll("새요소");
    -$("요소").wrapInner("새요소");
    -->
    <h2 id="title">
      <strong>wrap 메서드들</strong>
    </h2>
    <p class="ct1">내용1</p>
    <p class="ct1">내용2</p>
    <p class="ct2">내용3</p>
    <p class="ct2">내용4</p>

    <ul>
      <li>내용3</li>
      <li>내용4</li>
    </ul>
  </body>
  <script>
    $(function () {
      //strong태그의 부모태그(h2)를 삭제한다
      $("strong").unwrap();
      //.ct1을 div로 각각 감싼다.
      $(".ct1").wrap("<div/>");
      //.ct2를 div로 한번에 감싼다.
      $(".ct2").wrapAll("<div/>");

      $("li").wrapInner("<h3/>");
    });
  </script>
</html>
