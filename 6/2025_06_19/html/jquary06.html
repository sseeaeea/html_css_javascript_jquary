<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    3. clone() / empty() / remove()메서드

    clone()메서드는 선택한 요소를 복제하고 empty()메서드는 선택한
    요소의 모든 하위 요소를 삭제한다.
    remove()메서드는 선택한 요소를 삭제한다.

    [기본형]
    - $("요소").clone; 또는 $("요소").clone(true / false);
    선택한 요소를 복제한다. 인자값이 true면 이벤트까지 복제하고
    false면 요소만 복제한다. 기본값은 false이다.

    - $("요소").empty();
    선택한 요소의 하위 요소를 모두 삭제한다.

    - $("요소").remove();
    선택한 요소를 삭제한다.
    -->
    <div class="box1">
      <p>내용1</p>
      <p>내용2</p>
    </div>
    <div class="box2">
      <p>내용3</p>
      <p>내용4</p>
    </div>
    <div class="box3">
      <p>내용5</p>
      <p>내용6</p>
    </div>
  </body>
  <script>
    $(function () {
      //.box1의 자식요소를 복제하여 copyObj에 할당
      let copyObj = $(".box1").children().clone();
      //.box2를 삭제한다 이때 자식요소가 있다면 자식요소까지 모두 삭제한다.
      $(".box2").remove();
      //.box3안의 자식요소를 모두 삭제한다.
      $(".box3").empty();
      //.box3에 자식요소로 복제해뒀던 copyObj를 추가하기
      $(".box3").prepend(copyObj);
    });
  </script>
</html>
