<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    포커스 이벤트
    
    포커스는 마우스로 a태그 또는 form요소를 클릭하거나
    tap키를 눌렀을때 발생한다. 만약 사용자가 마우스 없이 키보드만
    이용해서 인터넷을 이용해야 하는 장애상황에 놓이게 되었을때
    마우스 이벤트만 등록이 되어 있다면 사용자는 사이트를 제대로 이용할 수 
    없게 된다. 이를 대응하기 위해 마우스이벤트를 등록할때에는
    포커스 이벤트도 함께 등록하는것이 좋다. 이를 '키보드접근성'이라고 한다.

    focus / blur / focusin / focusout

    focus이벤트는 대상 요소로 포커스가 이동하면 이벤트가 발생하고
    blur이벤트는 대상 요소에서 포커스가 사라지면 이벤트가 발생한다.
    focusin이벤트는 대상 요소의 하위요소 중에서 입력요소로 포커스가
    이동하면 이벤트가 발생하고
    focusout이벤트는 대상 요소의 하위 요소중 입력요소에서 외부 요소로 
    포커스가 이동하면 이벤트가 발생한다.

    [기본형]
    $("요소").focus(function(){ 코드 }) -> 단독이벤트
    $("요소").on("focus", function(){ 코드 }) -> 그룹이벤트
    $("요소").focus() -> 강제이벤트

    키보드로 마우스 이벤트 대응하기

    키보드 접근성이란 어떤 대상요소에 마우스 이벤트를 등록했을때 마우스 없이
    키보드로 대상요소를 사용할 수 있도록 대응해주는것을 말한다.
    마우스 이벤트 중 mouseover, mouseout 이벤트가 등록된 경우
    키보드로도 사이트를 이용할 수 있도록 반드시 focus와 blur이벤트를 함께
    등록해주는것이 좋다.

    [마우스 이벤트에 대한 ]
    -->
    <h3>focus / blur</h3>
    <form action="#" id="form1">
      <p>
        <label for="user_id1">id</label>
        <input type="text" name="user_id1" id="user_id1" />
      </p>
    </form>

    <h3>focusin / focusout</h3>
    <form action="#" id="form2">
      <p>
        <label for="user_id2">id</label>
        <input type="text" name="user_id2" id="user_id2" />
      </p>
    </form>

    <h3>키보드 접근성</h3>
    <button type="button" class="btn1">버튼</button>
    <p class="text">내용</p>
  </body>
  <script>
    $(function () {
      //focus blur
      $("#user_id1").on({
        focus: function () {
          $(this).css({
            outline: "none",
            border: "1px solid orange",
            color: "tomato",
          });
        },
      });
      $("#user_id1").on({
        blur: function () {
          $(this).css({
            outline: "",
            border: "",
            color: "",
          });
        },
      });

      // focusin focusout
      $("#form2").on("focusin", function () {
        $(this).css({
          backgroundColor: "gold",
        });
      });
      $("#form2").on("focusout", function () {
        $(this).css({
          backgroundColor: "",
        });
      });

      // 키보드 접근성을 고려하지 않은 코드
      $(".btn1").on("mouseover", function () {
        $(".text").css("display", "none");
      });
      // 키보드 접근성을 고려한 코드
      $(".btn1").on("mouseover focus", function () {
        $(".text").css("display", "none");
      });
    });
  </script>
</html>
