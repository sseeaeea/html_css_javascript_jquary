<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    keydown / keyup / keypress

    keydown, keypress이벤트는 선택한 요소에서 키보드
    자판을 눌렀을때 이벤트가 발생한다. 두 이벤트의 차이점은
    keydown은 모든 키(한영키 제외)에 대해 이벤트를 발생시키고
    keypress는 기능키에 대해서는 이벤트를 발생시키지 않는다.
    기능키란 esc, space bar, 화살표 방향키, insert, alt, delete와 같은
    문자, 숫자를 제외한 키를 말한다.

    그리고 키보드 이벤트 핸들러에서 생성된 이벤트 객체의 속성을
    이용하면 고유 키의 코드값을 구할 수 있다. 이를 이용해 단축키를
    만들 수 있다.

    keyup은 키보드의 키를 눌렀다 땠을때 이벤트가 발생한다.

    [기본형]
    $("요소").keydown(function(){ 코드 }) -> 단독
    $("요소").on("keydown", function(){ 코드 }) -> 그룹
    $("요소").keydown(); -> 강제
    -->
    <p>
      <input type="text" name="shotcut" id="shotcut" />
    </p>
  </body>
  <script>
    $(function () {
      //문서에서 키가 눌리면 이벤트 핸들러가 실행
      $(document).keydown(function (event) {
        //키의 고유값(아스키코드값)을 확인하기 위한 변수
        let keycode = event.keyCode;
        // console.log(keycode);
        let direct = ""; // keyCode와 같은 키가 눌렸을때 문자를 담아줄 변수
        switch (event.keyCode) {
          case 37:
            direct = "LEFT";
            break;
          case 38:
            direct = "TOP";
            break;
          case 39:
            direct = "RIGHT";
            break;
          case 40:
            direct = "BOTTOM";
            break;
        }
        $("#shotcut").val(direct);
      });
    });
  </script>
</html>
