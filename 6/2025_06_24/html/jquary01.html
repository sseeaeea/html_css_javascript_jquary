<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        width: 100%;
        height: auto;
      }
      header {
        width: 100%;
        height: 70px;
        background-color: aqua;
      }
      h1 {
        line-height: 70px;
        text-align: center;
      }
      main {
        width: 100%;
        height: auto;
      }
      section {
        width: 100%;
        height: 100vh;
        background-color: blueviolet;
        color: #fff;
        font-size: 100px;
        text-align: center;
        line-height: 100vh;
      }
      section:last-child {
        background-color: aquamarine;
      }
      footer {
        text-align: center;
        line-height: 80px;
      }
      /* 마우스커서 */
      .cursor {
        width: 52px;
        height: 52px;
        box-sizing: border-box;
        display: flex;
        visibility: hidden;
        justify-content: center;
        align-items: center;
        border-radius: 100%;
        backdrop-filter: invert(100%);
        position: fixed;
        top: 0;
        left: 0;
        transition: 0.2s linear;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>logo</h1>
      </header>
      <main>
        <!-- 마우스 커서 -->
        <div class="cursor"></div>
        <section>section1</section>
        <section>section2</section>
      </main>
      <footer>footer</footer>
    </div>
  </body>
  <script>
    $(function () {
      // 따라다니는 마우스 커서
      $(document).mousemove(function (event) {
        $(".cursor").css({
          visibility: visible,
          top: event.pageY + 8, // top값을 이벤트객체의 pageY값으로 변경
          left: event.pageX + 8, // left값을 이벤트객체의 pageX값으로 변경
          //event.pageY, event.pageX에는 마우스 커서에 대한 위치 좌표값,
          //즉, 숫자가 들어있다. 그래서 위치를 조정하려면 산술연산자로
          //값을 더하거나 빼서 수정할 수 있다.
        });
      });
    });
  </script>
</html>
