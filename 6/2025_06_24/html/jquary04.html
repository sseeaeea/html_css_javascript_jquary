<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    그룹 이벤트 등록 및 삭제하기

    그룹 이벤트를 등록할때 on()메서드를 이용하여 여러 개의 이벤트를
    한 번에 등록할 수 있다. 하지만 on()메서드 뿐만 아니라 다양한 메서드를
    통해 그룹이벤트를 등록할 수 있다.
    그리고 등록한 메서드의 이름에 따라 이벤트를 제거할때에도 이에 맞는
    제거 메서드를 사용해야 한다.

    [기본형]

    1. on()

    이벤트 대상 요소에 2개 이상의 이벤트를 등록할때 사용한다.
    사용방식에 따라 이벤트를 등록한 이후에도 동적으로 생성되거나
    복제된 요소에도 이벤트를 적용할 수 있다.

    2. bind()

    이벤트 대상 요소에 2개 이상의 이벤트를 등록할때 사용한다.

    3. delegate()

    선택한 요소의 하위요소에 이벤트를 등록한다. 이벤트를 등록한 이후에도
    동적으로 생성된 요소나 복제된 요소에도 이벤트를 등록할 수 있다.

    4. one()

    이벤트 대상 요소에 1개 이상의 이벤트를 등록할때 사용한다.
    지정한 이벤트가 1회 실행되면 자동으로 해제된다.

    라이브 이벤트

    동적으로 생성된 요소나 복제된 요소에 이벤트를 등록하는 것을 말한다.
    동적으로 생성된 요소는 HTML구조에 존재하지 않다가 자바스크립트 또는 
    제이쿼리에 의해 새롭게 생성된 요소나 복제된 요소를 말한다.

    앞에서 배운 일반 이벤트 등록방식으로는 동적으로 생성된 요소에 이벤트를
    등록할 수 없다. 그래서 동적인 요소에 이벤트를 등록하려면 라이브 이벤트
    등록방식을 사용해야한다.

    [기본형]

    1. on()

    $(document 또는 "요소의 상위요소").on("이벤트종류", "이벤트대상",function(){
       코드~
    })

    2. delegate()

    $(document 또는 "요소의 상위요소").delegate("이벤트대상", "이벤트종류", function(){
       코드~ // delegate()메서드는 이벤트 대상이 먼저 나와야 함
    })

    3. one()
    $(document 또는 "요소의 상위요소").one("이벤트종류", "이벤트대상",function(){
       코드~
    })

    -->
    <h3>on()라이브 이벤트 등록</h3>
    <div id="wrap">
      <p><button class="btn1">버튼1</button></p>
      <p><button class="btn2">버튼2</button></p>
    </div>
    <h3>delegate()라이브 이벤트 등록</h3>
    <div id="wrap2">
      <p class="btn_wrap"><button class="btn3">버튼3</button></p>
      <p><button class="btn4">버튼4</button></p>
    </div>
    <h3>one()라이브 이벤트 등록</h3>
    <div id="wrap3">
      <p><button class="btn5">버튼5</button></p>
    </div>
  </body>
  <script>
    $(function () {
      //일반 그룹이벤트 등록방식 - on()
      //동적으로 생성된 클래스명으로는 이벤트를 등록할 수 없다.
      $(".btn1.on").on("click", function () {
        alert("hello");
      });
      $(".btn1").addClass("on");
      // 제이쿼리에서 생성된 이름이므로 "동적으로 생성된 이름"이다.

      //라이브 이벤트 등록방식 - on()
      $(document).on("click", ".btn2.on", function () {
        alert("nice to meet you");
      });
      // .btn2에 클래스명을 동적으로 추가함
      $(".btn2").addClass("on");

      $(".btn_wrap").delegate(".btn3.on", "mouseover focus", function () {
        alert("hello");
      });
      $(".btn3").addClass("on");
      // btn4에도 delegate메서드로 라이브 이벤트 등록하기
      $(document).delegate(".btn4.on", "mouseover focus", function () {
        alert("bye");
      });
      $(".btn4").addClass("on");

      $("#wrap3").one("mouseover focus", ".btn5", function () {
        // .btn5 뒤에 버튼태그를 새 요소로 추가함
        $(".btn5").after("<button class='btn5'>버튼6</button>");
      });
      // 동적으로 생성된 .btn6에 이벤트를 추가하기
      $(".wrap3").on("mouseover focus", ".btn5", function () {
        alert("button6");
      });
    });
  </script>
</html>
