<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>제이쿼리 선택자</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    인접 관계 선택자

    인접 관계 선택자란 직접 선택자(class, id, 태그명...)로 요소를 먼저 선택한 후
    주위에 있는 요소를 선택할 때 사용한다.
    예를 들어 특정 태그의 부모요소나 주위에 있는 형제요소등을 선택하고자 할때
    인접관계 선택자를 사용할 수 있다.

    1. 부모요소 선택자 parent()메서드

    부모 요소 선택자는 선택한 요소를 감싸고 있는 부모요소를 선택한다.

    [기본형]
    1. $("요소 자식요소") -> 요소를 기준으로 하위요소를 불러온다.
    2. $("요소 > 자식요소") -> 요소를 기준으로 자손요소를 불러온다.
    3. $("요소").children("자식요소") -> 요소의 자식 중 특정 자식요소를 불러온다.
    4. $("요소").children() -> 선택한 요소를 기준으로 모든 자식을 불러온다.

    css메서드 사용법

    1. 인자값을 사용해서 css속성과 값을 전달하는 방식

    [기본형]
    $("요소").css("속성", "값").css("속성", "값")...;

    2. 객체를 사용해 css속성과 값을 전달하는 방식
    [기본형]

    $("요소").css({
      속성: 값,
      속성: 값,
      ...
    });
    -->
    <div id="wrap">
      <div class="inner_wrap">
        <h1>제목1</h1>
        <h2>제목2</h2>
        <p>내용1</p>
        <p>내용2</p>
        <p>내용3</p>
      </div>
    </div>
    <ul id="list_wrap">
      <li>
        리스트1
        <ul>
          <li id="list_1">리스트1-1</li>
          <li>리스트1-2</li>
        </ul>
      </li>
      <li>리스트2</li>
      <li>리스트3</li>
    </ul>
  </body>
  <script>
    $(function () {
      //h2의 다음위치에 있는 동생태그 p태그에 css를 적용한다.
      $("h2").next().css("color", "tomato").css("background-color", "skyblue");
      //h2의 부모요소(#inner_wrap)에 border를 적용함
      $("h2").parent().css("border", "1px solid skyblue");
      //list_1의 부모요소에 배경색을 적용하기
      $("#list_1").parent().css("background-color", "tomato");
      $("#inner_wrap p").css("text-decoration", "under-line");
      $("#inner_wrap > h1").css("color", "orange");
      $("#list_wrap").children().css({
        //css를 한꺼번에 적용하고 싶다면  {}객체를 사용한다.
        color: "red",
        textDecoration: "underline",
        border: "1px solid blue",
      });
    });
  </script>
</html>
