<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인접관게선택자</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    형(이전) / 동생(다음) 요소 선택자 
    형 선택자는 선택한 요소를 기준으로 바로 이전 위치에 있는 형제 요소만
    선택한다. 동생 선택자도 선택한 요소를 기준으로 바로 다음 위치에 있는
    형제 요소만 선택한다.

    [기본형]
    1. $("요소").prev() -> 요소의 바로 윗줄의 형 태그를 선택한다.
    2. $("요소").next() -> 요소의 바로 다음 줄에 있는 동생 태그를 선택한다.
    3. $("요소 + 동생요소") -> 요소의 바로 다음 줄에 있는 동생태그를 선택한다.

    4. 전체 형(prevAll) / 동생(nextAll) 요소 선택자
    전체 형 선택자는 선택한 요소를 기준으로 위에 있는 모든 형 요소를 선택하고
    전체 동생 선택자는 모든 동생 요소를 선택해준다.

    5. 전체 형제 요소 선택자

    선택한 요소를 기준으로 모든 형제 요소를 선택하고싶다면 전체 형제 요소 선택자를
    사용한다.

    [기본형]
    $("요소").siblings();

    6. 범위 제한 형/동생요소 선택자

    선택한 요소를 기준으로 형제 요소 중 지정한 범위 내에 있는
    전체 형 또는 동생요소를 선택할때 사용한다.

    [기본형]
    $("요소").prevUntil("기준 형 요소") -> 요소와 기준 형 요소 사이에 있는 형 요소들을 선택한다.
    $("요소").nextUntil("기준 동생 요소") -> 요소와 기준 동생 요소 사이에 있는 동생 요소들을 선택한다.
    -->
    <div id="wrap">
      <h1>인접관계 선택자</h1>
      <p>내용1</p>
      <p class="txt">내용2</p>
      <p>내용3</p>
      <p>내용4</p>
    </div>
    <div id="wrap2">
      <h2>전체 형 / 동생 선택자</h2>
      <p>내용1</p>
      <p>내용2</p>
      <p>내용3</p>
      <p class="txt2">내용4</p>
      <p>내용5</p>
      <p>내용6</p>
      <p>내용7</p>
    </div>
    <div id="wrap3">
      <h2>범위 제한 형 / 동생 선택자</h2>
      <p>내용1</p>
      <p>내용2</p>
      <p>내용3</p>
      <p class="txt3">내용4</p>
      <p>내용5</p>
      <p>내용6</p>
      <p>내용7</p>
    </div>
  </body>
  <script>
    $(function () {
      let style1 = {
        color: "tomato",
        border: "1px solid skyblue",
        backgroundColor: "green",
      };
      let style2 = {
        color: "green",
        border: "1px solid tomato",
        backgroundColor: "blue",
      };

      //.txt에 형요소에 style1변수에 있는 css적용하기
      $(".txt").prev().css(style1);
      //.txt에 동생요소에 style2 변수에 있는 css적용하기
      $(".txt").next().css(style2);
      //동생의 동생
      $(".txt").next().next().css(style2);

      //.txt2의 모든 형 요소에 style적용하기
      $(".txt2").prevAll().css(style1);
      //.txt2의 모든 동생 요소에 style적용하기
      $(".txt2").nextAll().css(style2);
      //.txt2의 모든 형제요소에 style적용하기
      $(".txt2").siblings().css(style1);

      //.txt3과 h2사이에 있는 형 요소들을 선택함
      $(".txt3").prevUntil().css(style1);
    });
  </script>
</html>
