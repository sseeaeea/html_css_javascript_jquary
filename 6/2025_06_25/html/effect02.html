<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
      integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- 
    애니메이션 효과 제어 메서드

    애니메이션 효과 제어 메서드란 '효과'메서드와 '애니메이션'메서드가 
    적용된 요소의 동작을 제어하는 메서드를 말한다.
    애니메이션 효과 제어 메서드를 알려면 먼저 애니메이션 메서드가 어떻게
    적용되는지 원리를 알고 있어야한다.

    애니메이션 적용 원리와 큐의 개념

    애니메이션이나 효과메서드는 메서드가 적용된 순서대로 큐(Queue)라는
    공간(memory)에 저장된다. 큐는 카페에 주문을 하기 위해 대기중인
    손님들처럼 순서대로 애니메이션이 실행된다.(FIFO, first in first out)

    [애니메이션 효과 제어 메서드 종류]
    stop() : 현재 실행중인 효과를 모두 정지시킨다.
    delay() : 지정한 시간만큼 지연시켰다가 애니메이션을 실행한다.
    queue() : 큐에 사용자 지정 함수를 추가하거나 큐에 대기중인 함수들을
    배열에 담아 반환한다. 그리고 queue()이후에 대기중인 애니메이션
    메서드들은 모두 제거된다.
    clearQueue() : 큐에서 처음으로 진행하는 애니메이션을 제외하고 대기중인
    애니메이션은 모두 삭제한다.
    dequeue() : queue()메서드 사용 이후에 대기중인 애니메이션이 제거되지
    않도록 막아주는 메서드이다.
    finish() : 선택한 요소의 진행중인 애니메이션을 강제로 종료시점으로 보낸후에
    종료한다.

    stop() / delay()

    stop() 메서드는 요소에 적용한 애니메이션을 정지시키고, delay() 메서드는
    일정 시간동안 지연시킨후 애니메이션을 실행시킨다.

    [기본형]
    $("요소").stop();
    진행중인 첫 번째 애니메이션만 정지시킨다. 큐에서 대기중인 애니메이션을
    계속 실행한다.
    $("요소").stop(clearQueue, finish);
    : clearQueue, finish는 true또는 false로 값을 입력받을수있다. 기본값은 false다.
    clearQueue가 true면 Queue에 대기중인 애니메이션을 모두 제거하고
    finish가 true면 진행중인 애니메이션을 강제로 종료시킨다.

    $("요소").delay(지연시간ms).animation();
    요소의 애니메이션을 ms만큼 지연시킨후 다음에 연결된 애니메이션 메서드를
    실행한다.
    -->
    <p class="txt1">애니메이션1</p>
    <p class="txt2">애니메이션2</p>
    <p class="txt3">애니메이션3</p>
  </body>
  <script>
    $(function () {
      //진행중인 애니메이션만 정지시키는 경우
      $(".txt1")
        .animate({ opacity: 0.5 }, 1000)
        .animate({ marginLeft: "100px" }, 1000);
      $(".txt1").stop(); //첫번째 애니메이션을 정지시킴

      //대기중인 애니메이션을 제거하고 진행중인 애니메이션을 강제종료하는경우
      $(".txt2")
        .animate({ opacity: 0.5 }, 1000)
        .animate({ marginLeft: "100px" }, 1000);
      //clearQueue가 true이므로 대기중인 애니메이션을 삭제한다.
      //finish가 true이므로 첫번째 애니메이션을 강제로 종료시점으로 보낸다.
      //즉, marginLeft'100px'은 대기열에서 사라져서 실행되지않고
      //opacity: 0.5는 강제로 적용되어 css를 적용한것처럼 바로 변하고 종료한다.
      $(".txt2").stop(true, true);

      $(".txt3").delay(2000).animate({ marginLeft: 100 }, 1000);
    });
  </script>
</html>
