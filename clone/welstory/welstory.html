<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>삼성웰스토리</title>
    <link rel="stylesheet" href="./css/welstory_style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/xeicon/2/xeicon.min.css"
    />
    <link rel="stylesheet" href="./css/swiper.css" />
  </head>
  <body>
    <div class="container">
      <!-- header -->
      <header>
        <div class="header_con">
          <!-- 로고 -->
          <div class="logo">
            <a href="/">
              <h1>
                <img
                  src="https://www.samsungwelstory.com/assets/image/common/welstory_logo.svg"
                  alt=""
                />
              </h1>
            </a>
          </div>
          <!-- 메뉴 -->
          <nav id="gnb">
            <ul>
              <li>
                <a href="#" class="gnb_hover">Stroy</a>
                <ul class="sub_menu">
                  <li><a href="#">회사소개</a></li>
                  <li><a href="#">비전</a></li>
                  <li><a href="#">아카이브</a></li>
                  <li><a href="#">뉴스</a></li>
                  <li><a href="#">채용</a></li>
                  <li><a href="#">전자공고</a></li>
                </ul>
              </li>
              <li>
                <a href="#" class="gnb_hover">Solution & Service</a>
                <ul class="sub_menu">
                  <li><a href="#">푸드서비스</a></li>
                  <li><a href="#">헬스케어 솔루션</a></li>
                  <li><a href="#">식자재 유통</a></li>
                  <li><a href="#">360 솔루션</a></li>
                </ul>
              </li>
              <li>
                <a href="#" class="gnb_hover">Frontrunner</a>
                <ul class="sub_menu">
                  <li><a href="#">푸드테크</a></li>
                  <li><a href="#">R&D</a></li>
                  <li><a href="#">인프라</a></li>
                  <li><a href="#">글로벌 네트워크</a></li>
                </ul>
              </li>
              <li>
                <a href="#" class="gnb_hover">Innovation</a>
                <ul class="sub_menu" id="gnb_black">
                  <li><a href="#">welstroy Innovation Track</a></li>
                  <li><a href="#">Sustainable Story</a></li>
                </ul>
              </li>
            </ul>
          </nav>
          <!-- 아이콘 -->
          <div class="icons">
            <a href="#">
              <i class="xi-globus xi-2x"></i>
            </a>
          </div>
        </div>
      </header>
      <!-- main -->
      <main>
        <!-- Swiper -->
        <div class="container">
          <section id="sec1">
            <div class="swiper mySwiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <img
                    src="https://www.samsungwelstory.com/assets/image/main/main_visual_1.jpg"
                    alt=""
                  />
                </div>
                <div class="swiper-slide">
                  <img
                    src="https://www.samsungwelstory.com/assets/image/main/main_visual_2.jpg"
                    alt=""
                  />
                </div>
                <div class="swiper-slide">
                  <img
                    src="https://www.samsungwelstory.com/assets/image/main/main_visual_0.jpg"
                    alt=""
                  />
                </div>
              </div>
              <div class="swiper-button-next">
                <i class="xi-angle-right"></i>
              </div>
              <div class="swiper-button-prev">
                <i class="xi-angle-left"></i>
              </div>
            </div>
          </section>
        </div>
        <img src="./image/Saly-12.svg" alt="" />
      </main>
      <!-- footer -->
      <footer></footer>
    </div>
  </body>
  <!-- Swiper JS -->
  <script src="./js/swiper.js"></script>
  <script>
    var swiper = new Swiper(".mySwiper", {
      slidesPerView: 1,
      spaceBetween: 30,
      loop: true,
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
    });
  </script>
</html>
